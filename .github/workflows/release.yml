name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build and run checks for both loaders
        run: ./gradlew --no-daemon clean check build

      - name: Verify both release jars
        run: python3 scripts/verify-jars.py

      - name: Upload release jars for verification
        uses: actions/upload-artifact@v7
        with:
          name: theseus-jars
          path: |
            build/libs/theseus-neoforge-*.jar
            fabric/build/libs/theseus-fabric-*.jar
            !**/*-sources.jar
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Download built jars
        uses: actions/download-artifact@v8
        with:
          name: theseus-jars
          path: release-artifact

      - name: Verify version and both loader jars
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^modVersion=//p' gradle.properties | tail -n 1)"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match modVersion $VERSION" >&2
            exit 1
          fi
          mkdir -p release-jars
          find release-artifact -type f -name '*.jar' -exec cp {} release-jars/ \;
          python3 scripts/verify-jars.py release-jars
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            release-jars/*.jar \
            --title "Theseus $VERSION for Fabric and NeoForge" \
            --generate-notes
